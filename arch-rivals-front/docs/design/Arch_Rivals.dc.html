<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=Cinzel:wght@500;700&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#141215;color:#ece3cf;}
  body{font-family:'EB Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;}
  a{color:#d9b25c;text-decoration:none;} a:hover{color:#f2d58a;}
  @keyframes crownFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes glint{0%,100%{opacity:.35}50%{opacity:.9}}
</style>
</helmet>

<div data-screen-label="Accueil" style="min-height:100vh;background:radial-gradient(ellipse at 50% -10%, #2a2226 0%, #141215 55%);background-color:#141215;color:#ece3cf;">

  <!-- Nav -->
  <header style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px clamp(20px,5vw,72px);border-bottom:1px solid rgba(217,178,92,.25);">
    <a href="#" style="font-family:'Cinzel',serif;font-weight:700;letter-spacing:.14em;font-size:20px;color:#ece3cf;display:flex;align-items:center;gap:12px;">
      
      ARCH RIVALS
    </a>
    <nav style="display:flex;align-items:center;gap:28px;font-family:'Cinzel',serif;font-size:14px;letter-spacing:.1em;">
      <a href="#tournois" style="color:#bfb39a;" style-hover="color:#f2d58a;">Tournois</a>
      <a href="#classement" style="color:#bfb39a;" style-hover="color:#f2d58a;">Classement</a>
      <a href="#" onClick="{{ play }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 26px;background:#d9b25c;color:#1a1410;font-weight:700;border:2px solid #f2d58a;box-shadow:inset 0 0 0 2px #1a1410, 0 0 0 1px #d9b25c;" style-hover="background:#f2d58a;color:#1a1410;">Jouer</a>
    </nav>
  </header>

  <!-- Hero -->
  <section id="tournois" style="padding:clamp(48px,8vw,110px) clamp(20px,5vw,72px) 40px;text-align:center;">
    
    <h1 style="margin:0 auto;max-width:14ch;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(38px,7vw,88px);line-height:1.02;color:#f4ead4;text-wrap:balance;text-shadow:0 2px 0 #6b4f16, 0 6px 24px rgba(0,0,0,.6);">
      Rejoins <span style="color:#d9b25c;">&amp;</span> Gagne le tournoi
    </h1>
    
    <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:34px;">
      <a href="#" onClick="{{ play }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 34px;background:transparent;color:#ece3cf;font-family:'Cinzel',serif;font-weight:700;letter-spacing:.1em;font-size:15px;border:2px solid rgba(217,178,92,.6);" style-hover="border-color:#f2d58a;color:#f2d58a;">Rejoindre</a>
    </div>
  </section>

  <!-- Bracket -->
  

  <!-- Podium -->
  <section style="padding:0 clamp(16px,5vw,72px) clamp(56px,8vw,110px);">
    <div style="max-width: 1300px; box-sizing: border-box; overflow: hidden; margin: 0 auto; padding: clamp(20px,3vw,40px); background: linear-gradient(180deg,#1e1a1c,#17141a); border: 4px double #8a6b2c; box-shadow: 0 0 0 1px #2a2226, 0 30px 80px rgba(0,0,0,.55); width: 100%; height: 100%">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;">
        
        <span style="font-family:'Cinzel',serif;font-size:12px;letter-spacing:.2em;color:#d9b25c;">{{ bracketLabel }}</span>
      </div>
      <div style="display: grid; grid-template-columns: {{ gridCols }}; gap: clamp(8px,1.5vw,20px); overflow: hidden; width: 100%; min-width: 0; box-sizing: border-box">
        <sc-for list="{{ rounds }}" as="round" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; justify-content: space-around; gap: 10px; min-width: 0; height: 100%">
            <sc-for list="{{ round.matches }}" as="m" hint-placeholder-count="2">
              <div style="display:flex;flex-direction:column;gap:3px;position:relative;">
                <div onClick="{{ m.pickA }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;box-sizing:border-box;padding:0 12px;background:{{ m.bgA }};border:1px solid {{ m.borderA }};cursor:pointer;font-size:15px;color:#ece3cf;" style-hover="border-color:#d9b25c;">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ m.a }}</span>
                  <span style="font-family:'Cinzel',serif;font-size:13px;color:#d9b25c;">{{ m.scoreA }}</span>
                </div>
                <div onClick="{{ m.pickB }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;box-sizing:border-box;padding:0 12px;background:{{ m.bgB }};border:1px solid {{ m.borderB }};cursor:pointer;font-size:15px;color:#ece3cf;" style-hover="border-color:#d9b25c;">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ m.b }}</span>
                  <span style="font-family:'Cinzel',serif;font-size:13px;color:#d9b25c;">{{ m.scoreB }}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-for>
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; min-width: 0; height: 100%">
          <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;color:#d9b25c;">CHAMPION</span>
          <div style="width:100%;min-height:64px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 12px;background:linear-gradient(180deg,#3a2c12,#231a0c);border:2px solid #d9b25c;box-shadow:0 0 30px rgba(217,178,92,.25);font-family:'Cinzel',serif;font-weight:700;letter-spacing:.06em;font-size:15px;color:#f2d58a;text-align:center;">{{ champion }}</div>
        </div>
      </div>
      
    </div>
  </section><section id="classement" style="padding:clamp(56px,8vw,110px) clamp(20px,5vw,72px);text-align:center;border-top:1px solid rgba(217,178,92,.25);background:linear-gradient(180deg,#141215,#1a1518);">
    <h2 style="margin:0 auto;max-width:12ch;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(34px,6vw,72px);line-height:1.05;color:#f4ead4;text-shadow:0 2px 0 #6b4f16, 0 6px 24px rgba(0,0,0,.6);">Deviens le meilleur</h2>
    

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:clamp(6px,1.5vw,18px);max-width:760px;margin:64px auto 0;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0;">
        <span style="font-size:15px;color:#bfb39a;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">{{ second }}</span>
        <div style="width:100%;height:150px;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;background:linear-gradient(180deg,#3a3335,#232022);border:2px solid #9a9aa3;border-bottom:none;font-family:'Cinzel',serif;font-weight:700;font-size:46px;color:#d6d6de;">2</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0;">
        {{ crown }}
        <span style="font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:#f2d58a;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">{{ first }}</span>
        <div style="width:100%;height:230px;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;background:linear-gradient(180deg,#5a4318,#2a1f0c);border:2px solid #d9b25c;border-bottom:none;box-shadow:0 0 40px rgba(217,178,92,.25);font-family:'Cinzel',serif;font-weight:700;font-size:64px;color:#f2d58a;">1</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0;">
        <span style="font-size:15px;color:#bfb39a;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">{{ third }}</span>
        <div style="width:100%;height:105px;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;background:linear-gradient(180deg,#4a3226,#241812);border:2px solid #b87a4b;border-bottom:none;font-family:'Cinzel',serif;font-weight:700;font-size:40px;color:#d9a37a;">3</div>
      </div>
    </div>
    <div style="max-width:760px;margin:0 auto;height:3px;background:#d9b25c;"></div>
  </section>

  <!-- Footer -->
  <footer style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px clamp(20px,5vw,72px);border-top:1px solid rgba(217,178,92,.25);font-size:14px;color:#8f8570;">
    <span>Tous droits réservés à Footnament</span>
    <span style="font-family:'Cinzel',serif;letter-spacing:.14em;font-size:12px;color:#d9b25c;">♥ FOOT</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;bracketSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:8,&quot;options&quot;:[4,8,16],&quot;tsType&quot;:&quot;4|8|16&quot;,&quot;section&quot;:&quot;Tournoi&quot;},&quot;animateCrown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Podium&quot;}}">
class Component extends DCLogic {
  state = { winners: {} }; // key "r-i" -> 'a'|'b'
  teams16 = ['Chevaliers d\'Avalon','Bannière Noire','Ordre du Griffon','Les Templiers','Garde de Fer','Loups de Camelot','Dragons d\'Écosse','Lions de Bretagne','Faucons de Lyon','Sang Royal','Hallebardes','Vikings du Nord','Épées Brisées','Fils du Roc','Croisés','Héraut Pourpre'];
  renderVals() {
    const size = Number(this.props.bracketSize ?? 8);
    const w = this.state.winners;
    const roundCount = Math.log2(size);
    let entrants = this.teams16.slice(0, size);
    const rounds = [];
    for (let r = 0; r < roundCount; r++) {
      const matches = []; const next = [];
      for (let i = 0; i < entrants.length; i += 2) {
        const key = `${r}-${i / 2}`; const a = entrants[i], b = entrants[i + 1];
        const pick = w[key]; const win = pick === 'a' ? a : pick === 'b' ? b : null;
        next.push(win);
        const sel = (side) => (e) => { e.preventDefault(); if (!a || !b) return;
          this.setState(s => { const nw = { ...s.winners }; nw[key] = side;
            for (const k in nw) if (Number(k.split('-')[0]) > r) delete nw[k]; return { winners: nw }; }); };
        const style = (side) => pick && pick !== side ? { bg: '#151316', border: '#2b262a' } : pick === side ? { bg: '#2e2412', border: '#d9b25c' } : { bg: '#221e22', border: '#3d3540' };
        matches.push({ a: a ?? '—', b: b ?? '—', pickA: sel('a'), pickB: sel('b'),
          bgA: style('a').bg, borderA: style('a').border, bgB: style('b').bg, borderB: style('b').border,
          scoreA: pick === 'a' ? 'W' : pick === 'b' ? 'L' : '', scoreB: pick === 'b' ? 'W' : pick === 'a' ? 'L' : '' });
      }
      rounds.push({ matches }); entrants = next;
    }
    const champion = entrants[0] ?? 'À déterminer';
    const animate = this.props.animateCrown ?? true;
    const crown = React.createElement('svg', { width: 64, height: 44, viewBox: '0 0 64 44', 'aria-hidden': true,
      style: { animation: animate ? 'crownFloat 3s ease-in-out infinite' : 'none', filter: 'drop-shadow(0 6px 14px rgba(217,178,92,.45))' } },
      React.createElement('polygon', { points: '4,40 4,14 18,26 32,4 46,26 60,14 60,40', fill: '#d9b25c', stroke: '#f2d58a', strokeWidth: 2 }),
      React.createElement('rect', { x: 4, y: 34, width: 56, height: 6, fill: '#8a6b2c' }));
    return { rounds, roundCount, gridCols: `repeat(${roundCount + 1}, minmax(0,1fr))`, champion, crown,
      bracketLabel: `${size} ÉQUIPES · ÉLIMINATION DIRECTE`,
      first: this.props.first ?? 'Chevaliers d\'Avalon', second: this.props.second ?? 'Ordre du Griffon', third: this.props.third ?? 'Loups de Camelot',
      play: (e) => { e.preventDefault(); const el = document.getElementById('tournois'); if (el) window.scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' }); } };
  }
}
</script>
</body>
</html>
